<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>此刻扩展设置</title><style>
:root{color-scheme:light;--paper:#f7f3e9;--card:#fffcf6;--ink:#202925;--tea:#244236;--line:rgba(36,66,54,.15)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif}.wrap{width:min(720px,calc(100% - 32px));margin:0 auto;padding:50px 0}.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}.mark{width:42px;height:42px;border-radius:14px;background:var(--tea);position:relative}.mark::before{content:"";position:absolute;inset:10px;border:2px solid var(--paper);border-radius:50%}.brand strong{font-family:"Songti SC",serif;font-size:24px}.card{padding:30px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 26px 70px rgba(44,54,45,.12)}h1{margin:0 0 8px;font-family:"Songti SC",serif;font-size:32px}p{margin:0 0 24px;color:#6f7b72;line-height:1.8}.field{display:grid;gap:7px;margin-bottom:16px}.field span{font-size:13px;font-weight:700;color:#536058}.field input{min-height:48px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.field input:focus{outline:3px solid rgba(118,145,122,.22);border-color:#76917a}.actions{display:flex;gap:10px;align-items:center;margin-top:22px}.button{min-height:46px;padding:11px 18px;border-radius:12px;border:1px solid var(--tea);background:var(--tea);color:var(--paper);font-weight:700;cursor:pointer}.secondary{background:#fff;color:var(--tea)}.status{color:#4e8062;font-size:13px}
</style></head>
<body><main class="wrap"><header class="brand"><span class="mark"></span><strong>此刻 · 教务扩展设置</strong></header><section class="card"><h1>连接你的云端空间</h1><p>填写 Supabase 项目地址和匿名公钥。匿名公钥可以公开，但仍建议只在自己设备上使用扩展。空间密钥将在教务页面导入时输入。</p><form id="configForm"><label class="field"><span>Supabase 项目地址</span><input id="supabaseUrl" type="url" placeholder="https://xxxx.supabase.co" required></label><label class="field"><span>Supabase 匿名公钥</span><input id="supabaseAnonKey" type="text" placeholder="eyJhbGciOi..." required></label><label class="field"><span>此刻网页地址</span><input id="appUrl" type="url" placeholder="https://name.github.io/now-planner/"></label><div class="actions"><button class="button" type="submit">保存设置</button><span class="status" id="status"></span></div></form></section></main><script type="module" src="options.js"></script></body>
</html>
